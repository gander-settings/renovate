name: CI

on:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 06:17 UTC: catches presets broken by new Renovate releases
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate presets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      # Presets live in the repo root under custom names, so they have to be passed
      # explicitly (the validator only scans renovate.json and friends by default),
      # and --no-global makes it treat them as shareable presets, not global config.
      - name: Validate Renovate presets
        run: npx --yes --package renovate -- renovate-config-validator --strict --no-global *.json
